name: Deploy to Pi

# The self-hosted runner lives on the Pi. It updates the existing checkout in
# place so the untracked database and gitignored secrets remain intact.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-pi-hyrox
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, hyrox-pi]
    steps:
      - name: Pull latest and rebuild if needed
        working-directory: /home/admin/Projects/hyrox
        run: |
          set -euo pipefail
          before=$(git rev-parse HEAD)
          git fetch origin main
          git reset --hard origin/main
          after=$(git rev-parse HEAD)
          echo "Deployed $before -> $after"

          if [ "$before" = "$after" ]; then
            echo "No new commits; nothing to do."
            exit 0
          fi

          if git diff --name-only "$before" "$after" \
               | grep -qE '^(src/|pyproject\.toml|Dockerfile|README\.md|docker-compose\.yml|\.dockerignore)'; then
            echo "Image inputs changed — rebuilding."
            docker compose up -d --build
          else
            echo "No image-affecting changes — recreating only if compose config changed."
            docker compose up -d
          fi

          docker compose ps
